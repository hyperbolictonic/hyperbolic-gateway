name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/welcome.html'
      - 'public/assets/**'
      - 'docs/**'
      - 'kuang_docs/**'
      - 'packages/**'
      - 'src/**/README.md'
      - 'scripts/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'TODO_RESEARCH_CRAWL.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile

      - name: Assemble site
        run: |
          pnpm build:pages
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
