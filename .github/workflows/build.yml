name: build

# Builds installers for all three platforms, then attaches them to the GitHub release.
# Patches publish automatically; minor/major releases are left as a draft for a human to publish.
# See docs/BUILDING.md §4 for the policy and the manual fallback.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (only effective when run from a tag ref, e.g. --ref v1.4.5)'
        type: boolean
        default: false
      force_draft:
        description: 'Force a draft even for a patch tag'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  guard:
    name: release tag guard
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json for artefact releases
        id: check
        # On a branch ref (manual run) pass nothing; the script then builds all platforms.
        run: node scripts/check-release-tag.mjs "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

  build:
    name: ${{ matrix.platform }}
    needs: guard
    # Four-part tags (v1.4.2.1, …) are documentation-only: the guard emits build=false and the
    # matrix is skipped rather than failing. A manual run (no tag) emits build=true.
    if: needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npm cannot install this tree (a dependency uses a `patch:` protocol); pnpm is required.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (tsc + vite + MCP bundle)
        run: pnpm build

      # Offline check: every catalog tool must map to a route the bridge serves. Cheap, and it
      # catches the most common breakage before packaging.
      - name: MCP contract test (offline)
        run: node scripts/test-mcp-contract.mjs

      # electron-builder resolves/downloads the correct Electron for the target platform. It used to
      # be pinned to node_modules/electron/dist, which does not exist on a pnpm CI checkout.

      - name: Linux packaging deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      # Unsigned by decision (docs/BUILDING.md §5): macOS ships unsigned until the Developer ID is
      # borrowed, and macOS auto-update stays disabled until then.
      - name: Package (unsigned)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          EXTRA=""
          if [ "${{ matrix.platform }}" = "mac" ]; then EXTRA="-c.mac.identity=null"; fi
          pnpm exec electron-builder --${{ matrix.platform }} --publish never $EXTRA

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/*.yml

  publish:
    name: publish release
    needs: [guard, build]
    # Only tag refs can be released. A manual dispatch on a tag can opt in with `publish`.
    if: >-
      needs.guard.outputs.build == 'true' &&
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        run: |
          mkdir -p assets
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o \
            -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} assets/ \;
          # GitHub turns spaces in asset names into dots, but electron-builder's feeds use
          # hyphens. Rename here so the feed URL, the asset name and the updater agree.
          for f in assets/*\ *; do [ -e "$f" ] && mv "$f" "${f// /-}"; done
          echo "Staged $(ls -1 assets | wc -l) assets:"
          ls -lh assets

      - name: Release notes from CHANGELOG
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Create draft, upload assets, publish (patches only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FORCE_DRAFT: ${{ inputs.force_draft == true }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          fi

          gh release upload "$TAG" assets/* --clobber

          # v1.4.6 = patch -> go live. v1.5.0 / v2.0.0 -> stay a draft.
          if [[ "$FORCE_DRAFT" != "true" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[1-9][0-9]*$ ]]; then
            gh release edit "$TAG" --draft=false --latest
            echo "Published $TAG (patch)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Draft ready: $TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "Publish with: \`gh release edit $TAG --draft=false --latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Assets: $(ls -1 assets | wc -l)" >> "$GITHUB_STEP_SUMMARY"
